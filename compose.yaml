name: calos
services:
  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3002"
      CALOS_DATA_DIR: /data
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - calos_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/api/health', {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) throw new Error(String(r.status));}).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  calos_data:
